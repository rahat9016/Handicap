# ===============================
#      GitLab CI for Next.js
# ===============================

image: node:22

stages:
  - prepare
  - install
  - lint
  - build

# Run pipeline on:
# - every push
# - every merge request
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

# 1) Fix git safe directory issue
mark_git_safe:
  stage: prepare
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - echo "Git directory marked safe"
    - node -v
    - npm -v

# 2) Install dependencies
install_dependencies:
  stage: install
  needs: ["mark_git_safe"]
  script:
    - echo "Installing dependencies..."
    - npm ci
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - .npm
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

# 3) LINT
lint:
  stage: lint
  needs: ["install_dependencies"]
  script:
    - echo "Running ESLint..."
    - npm run lint

# 4) BUILD (Next.js)
build:
  stage: build
  needs: ["install_dependencies"]
  script:
    - echo "Building project..."
    - npm run build
  artifacts:
    name: "next-build-${CI_COMMIT_REF_SLUG}"
    paths:
      - .next
    expire_in: 1 week
